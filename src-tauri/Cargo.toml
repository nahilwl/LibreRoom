[package]
name = "libreroom"
version = "0.1.0"
description = "Local, private AI photo editor and background remover"
authors = ["nahilwl"]
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

[lib]
name = "libreroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }
sha2 = "0.10"
tauri = { version = "2.12.5", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
