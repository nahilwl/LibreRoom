# Deploys the web version to GitHub Pages: https://nahilwl.github.io/LibreRoom/
# Manual only (Actions tab → "Deploy web version" → Run workflow): it never runs on push.
# One-time repository setting: Settings → Pages → Source: "GitHub Actions".
name: Deploy web version

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never interrupt a deployment halfway

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
      - name: Check the static site
        run: |
          grep -q 'src="/LibreRoom/assets/' dist/index.html
          grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
          test -f dist/coi-sw.js
          test -f dist/theme.js
          test ! -e dist/selftest.html
          ls -la dist dist/assets
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
